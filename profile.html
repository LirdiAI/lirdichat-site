<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LirdiChat AI — Профиль</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .profile-card {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2a2a;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: #2a2a2a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            color: #00e676;
            margin: 0 auto 15px auto;
            border: 2px solid #00e676;
        }

        .user-name {
            font-size: 1.6rem;
            font-weight: bold;
            color: #fff;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #252525;
            padding: 12px 16px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .info-label {
            color: #aaa;
            font-size: 0.9rem;
        }

        .info-value {
            font-weight: bold;
            color: #fff;
            font-size: 0.95rem;
        }

        .plan-badge {
            padding: 4px 10px;
            border-radius: 6px;
            background: #333;
        }
        .plan-badge.plus {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
        }
        .plan-badge.pro {
            background: rgba(255, 179, 0, 0.15);
            color: #ffb300;
            border: 1px solid #ffb300;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .btn-back {
            background: #2a2a2a;
            color: #fff;
        }
        .btn-back:hover {
            background: #383838;
        }
        .btn-logout {
            background: transparent;
            color: #ff5252;
            border: 1px solid #ff5252;
        }
        .btn-logout:hover {
            background: rgba(255, 82, 82, 0.1);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar" id="avatarLetter">U</div>
            <div class="user-name" id="userName">Пользователь</div>
        </div>

        <div class="info-list">
            <div class="info-item">
                <span class="info-label">Логин:</span>
                <span class="info-value" id="userLogin">—</span>
            </div>

            <div class="info-item">
                <span class="info-label">Текущая подписка:</span>
                <span class="info-value plan-badge" id="userPlan">Free</span>
            </div>

            <div class="info-item">
                <span class="info-label">Срок подписки:</span>
                <span class="info-value" id="userExpiry" style="color: #00e676;">—</span>
            </div>

            <div class="info-item">
                <span class="info-label">Дата создания аккаунта:</span>
                <span class="info-value" id="userCreatedAt">—</span>
            </div>
        </div>

        <div class="actions">
            <a href="index.html" class="btn btn-back">← Назад в чат</a>
            <button class="btn btn-logout" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('lirdi_user'));

        if (!user) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('userName').innerText = user.login;
            document.getElementById('userLogin').innerText = user.login;
            document.getElementById('avatarLetter').innerText = user.login.charAt(0).toUpperCase();

            // Плашка подписки
            const planBadge = document.getElementById('userPlan');
            planBadge.innerText = user.plan || 'Lirdi Free';
            if (user.plan === 'Lirdi Plus') planBadge.classList.add('plus');
            if (user.plan === 'Lirdi Pro') planBadge.classList.add('pro');

            // Округленный расчет срока подписки
            document.getElementById('userExpiry').innerText = formatSubscriptionDays(user.expiryTimestamp);

            // Дата создания аккаунта (округленная до даты)
            const createdDate = user.createdAt ? new Date(user.createdAt) : new Date();
            document.getElementById('userCreatedAt').innerText = createdDate.toLocaleDateString('ru-RU', {
                day: 'numeric',
                month: 'long',
                year: 'numeric'
            });
        }

        function formatSubscriptionDays(expiryTimestamp) {
            if (!expiryTimestamp) return 'Бессрочно (Free)';

            const now = Date.now();
            const diffMs = expiryTimestamp - now;

            if (diffMs <= 0) return 'Истекла';

            // Округляем до целого количества дней
            const daysLeft = Math.round(diffMs / (1000 * 60 * 60 * 24));
            
            if (daysLeft < 1) return 'Менее 1 дня';
            return `Осталось ~${daysLeft} дн.`;
        }

        function logout() {
            localStorage.removeItem('lirdi_user');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
