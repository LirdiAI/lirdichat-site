<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный Кабинет — LirdiChat AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid #2a2a2a;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #fff;
            text-decoration: none;
        }
        .logo span {
            color: #00e676;
        }

        .btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background: #00c853;
        }

        .btn-outline {
            background: transparent;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-outline:hover {
            background: #2a2a2a;
        }

        .profile-card {
            width: 100%;
            max-width: 800px;
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        .profile-title {
            font-size: 1.6rem;
            margin-bottom: 20px;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .info-group {
            margin-bottom: 20px;
        }

        .info-label {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.2rem;
            color: #fff;
            font-weight: 500;
        }

        .plan-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            background: #2a2a2a;
            color: #ccc;
        }
        .plan-badge.plus {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
            border: 1px solid #00e676;
        }
        .plan-badge.pro {
            background: rgba(255, 179, 0, 0.15);
            color: #ffb300;
            border: 1px solid #ffb300;
        }

        .input-edit {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            font-size: 1rem;
            width: 100%;
            max-width: 300px;
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">LirdiChat <span>AI</span></a>
        <a href="index.html" class="btn btn-outline">💬 Вернуться к чату</a>
    </header>

    <div class="profile-card">
        <h1 class="profile-title">Личный кабинет</h1>

        <div id="profileLoading" style="color: #888;">Загрузка данных профиля...</div>

        <div id="profileContent" style="display: none;">
            <div class="info-group">
                <div class="info-label">Никнейм</div>
                <div id="nicknameViewArea">
                    <span class="info-value" id="profUsername">-</span>
                    <button class="btn btn-outline" style="padding: 4px 10px; font-size: 0.8rem; margin-left: 10px;" onclick="enableNicknameEdit()">Изменить</button>
                </div>
                <div id="nicknameEditArea" style="display: none; margin-top: 8px;">
                    <input type="text" id="newUsernameInput" class="input-edit">
                    <div class="edit-actions">
                        <button class="btn" style="padding: 6px 12px; font-size: 0.9rem;" onclick="saveNewUsername()">Сохранить</button>
                        <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.9rem;" onclick="cancelNicknameEdit()">Отмена</button>
                    </div>
                </div>
            </div>

            <div class="info-group">
                <div class="info-label">Электронная почта</div>
                <div class="info-value" id="profEmail">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Текущий тариф подписки</div>
                <div style="margin-top: 5px;">
                    <span class="plan-badge" id="profPlanBadge">Lirdi Free</span>
                </div>
            </div>

            <div class="info-group">
                <div class="info-label">Срок действия подписки</div>
                <div class="info-value" id="profExpiry" style="font-size: 1rem; color: #aaa;">Бессрочно</div>
            </div>

            <hr style="border: none; border-top: 1px solid #333; margin: 25px 0;">

            <div style="display: flex; justify-content: space-between; align-items: center;">
                <a href="index.html" class="btn">Изменить подписку</a>
                <button class="btn btn-outline" style="color: #ff5252; border-color: #ff5252;" onclick="logoutProfile()">Выйти из аккаунта</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc,
            updateDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAqPVKcW2obU55tAQfugTRJEWxq8g7t4wM",
            authDomain: "lirdiai.firebaseapp.com",
            projectId: "lirdiai",
            storageBucket: "lirdiai.firebasestorage.app",
            messagingSenderId: "274718906594",
            appId: "1:274718906594:web:801117410631e413f4a6bb",
            measurementId: "G-NVMW29VP0G"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        renderProfile(userDoc.data());
                    } else {
                        renderProfile({ username: user.email.split('@')[0], email: user.email, plan: 'Lirdi Free' });
                    }
                } catch (e) {
                    console.error("Ошибка загрузки:", e);
                }
            } else {
                // Если не авторизован - перенаправляем на главную
                window.location.href = "index.html";
            }
        });

        function renderProfile(data) {
            document.getElementById('profileLoading').style.display = 'none';
            document.getElementById('profileContent').style.display = 'block';

            document.getElementById('profUsername').innerText = data.username || 'Пользователь';
            document.getElementById('profEmail').innerText = data.email || currentUser.email;

            const badge = document.getElementById('profPlanBadge');
            const plan = data.plan || 'Lirdi Free';
            badge.innerText = plan;
            badge.className = 'plan-badge';

            if (plan === 'Lirdi Plus') badge.classList.add('plus');
            if (plan === 'Lirdi Pro') badge.classList.add('pro');

            const expiryDiv = document.getElementById('profExpiry');
            if (data.expiryTimestamp) {
                const expDate = new Date(data.expiryTimestamp);
                expiryDiv.innerText = "Активна до: " + expDate.toLocaleDateString('ru-RU');
            } else {
                expiryDiv.innerText = "Бессрочно";
            }
        }

        window.enableNicknameEdit = function() {
            document.getElementById('nicknameViewArea').style.display = 'none';
            document.getElementById('nicknameEditArea').style.display = 'block';
            document.getElementById('newUsernameInput').value = document.getElementById('profUsername').innerText;
        };

        window.cancelNicknameEdit = function() {
            document.getElementById('nicknameViewArea').style.display = 'block';
            document.getElementById('nicknameEditArea').style.display = 'none';
        };

        window.saveNewUsername = async function() {
            const newName = document.getElementById('newUsernameInput').value.trim();
            if (!newName || !currentUser) return;

            try {
                await updateDoc(doc(db, "users", currentUser.uid), { username: newName });
                document.getElementById('profUsername').innerText = newName;
                cancelNicknameEdit();
            } catch (e) {
                alert("Ошибка сохранения: " + e.message);
            }
        };

        window.logoutProfile = async function() {
            await signOut(auth);
            window.location.href = "index.html";
        };
    </script>
</body>
</html>
