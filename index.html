<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LirdiChat AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .auth-container, .chat-container {
            width: 100%;
            max-width: 450px;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            max-width: 800px;
            height: 90vh;
            display: none;
        }

        h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #bb86fc;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #3d3d3d;
            border-radius: 6px;
            color: #fff;
            font-size: 1em;
            outline: none;
        }

        input:focus {
            border-color: #bb86fc;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #bb86fc;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #9965f4;
        }

        .toggle-auth {
            margin-top: 15px;
            text-align: center;
            font-size: 0.9em;
            color: #a0a0a0;
        }

        .toggle-auth span {
            color: #bb86fc;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #cf6679;
            font-size: 0.85em;
            margin-top: 5px;
            text-align: center;
        }

        /* Chat Styles */
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3d3d3d;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .logout-btn {
            width: auto;
            padding: 6px 12px;
            background-color: #cf6679;
            margin-top: 0;
            color: #fff;
        }

        .logout-btn:hover {
            background-color: #b00020;
        }

        .messages-box {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background-color: #bb86fc;
            color: #000;
        }

        .message.bot {
            align-self: flex-start;
            background-color: #2c2c2c;
            color: #e0e0e0;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .chat-input-area input {
            flex-grow: 1;
        }

        .chat-input-area button {
            width: auto;
            padding: 12px 20px;
            margin-top: 0;
        }
    </style>
</head>
<body>

    <!-- Auth Form -->
    <div class="auth-container" id="authContainer">
        <h2 id="authTitle">Вход в LirdiChat AI</h2>
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>
        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>
        <button id="authBtn" onclick="handleAuth()">Войти</button>
        <div class="error-message" id="errorMessage"></div>
        <div class="toggle-auth">
            <span id="toggleText">Нет аккаунта? Зарегистрироваться</span>
        </div>
    </div>

    <!-- Chat Interface -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <h3>LirdiChat AI</h3>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        <div class="messages-box" id="messagesBox">
            <div class="message bot">Привет! Чем я могу помочь тебе сегодня?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <!-- Firebase SDK Modular -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Ваша конфигурация Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAqPVKcW2obU55tAQfugTRJEWxq8g7t4wM",
            authDomain: "lirdiai.firebaseapp.com",
            projectId: "lirdiai",
            storageBucket: "lirdiai.firebasestorage.app",
            messagingSenderId: "274718906594",
            appId: "1:274718906594:web:801117410631e413f4a6bb",
            measurementId: "G-NVMW29VP0G"
        };

        // Инициализация Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let isSignUp = false;

        // Элементы UI
        const authContainer = document.getElementById('authContainer');
        const chatContainer = document.getElementById('chatContainer');
        const authTitle = document.getElementById('authTitle');
        const authBtn = document.getElementById('authBtn');
        const toggleText = document.getElementById('toggleText');
        const errorMessage = document.getElementById('errorMessage');

        // Переключение режимов Вход / Регистрация
        toggleText.addEventListener('click', () => {
            isSignUp = !isSignUp;
            errorMessage.textContent = '';
            if (isSignUp) {
                authTitle.textContent = 'Регистрация в LirdiChat AI';
                authBtn.textContent = 'Зарегистрироваться';
                toggleText.textContent = 'Уже есть аккаунт? Войти';
            } else {
                authTitle.textContent = 'Вход в LirdiChat AI';
                authBtn.textContent = 'Войти';
                toggleText.textContent = 'Нет аккаунта? Зарегистрироваться';
            }
        });

        // Авторизация / Регистрация
        window.handleAuth = async () => {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            errorMessage.textContent = '';

            if (!email || !password) {
                errorMessage.textContent = 'Заполните все поля!';
                return;
            }

            try {
                if (isSignUp) {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (error) {
                switch (error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage.textContent = 'Email уже используется!';
                        break;
                    case 'auth/invalid-email':
                        errorMessage.textContent = 'Некорректный Email!';
                        break;
                    case 'auth/weak-password':
                        errorMessage.textContent = 'Пароль должен быть не менее 6 символов!';
                        break;
                    case 'auth/user-not-found':
                    case 'auth/wrong-password':
                    case 'auth/invalid-credential':
                        errorMessage.textContent = 'Неверный Email или пароль!';
                        break;
                    default:
                        errorMessage.textContent = 'Ошибка: ' + error.message;
                }
            }
        };

        // Выход из системы
        window.logout = () => {
            signOut(auth);
        };

        // Отслеживание состояния входа
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.style.display = 'none';
                chatContainer.style.display = 'flex';
            } else {
                authContainer.style.display = 'flex';
                chatContainer.style.display = 'none';
            }
        });
    </script>

    <!-- Логика чата -->
    <script>
        function sendMessage() {
            const input = document.getElementById('userInput');
            const messageText = input.value.trim();
            if (!messageText) return;

            const messagesBox = document.getElementById('messagesBox');

            // Сообщение пользователя
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = messageText;
            messagesBox.appendChild(userMsg);

            input.value = '';
            messagesBox.scrollTop = messagesBox.scrollHeight;

            // Ответ ИИ (заглушка или вызов API)
            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = 'message bot';
                botMsg.textContent = 'Это тестовый ответ от LirdiChat AI.';
                messagesBox.appendChild(botMsg);
                messagesBox.scrollTop = messagesBox.scrollHeight;
            }, 600);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
