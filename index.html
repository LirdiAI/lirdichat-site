<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LirdiChat AI — Онлайн Веб-Чат</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 2rem;
            color: #ffffff;
        }
        h1 span {
            color: #00e676;
        }
        
        /* Панель API Ключа */
        .api-panel {
            background: #1e1e1e;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            border: 1px solid #333;
        }
        .api-panel input {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        /* Контейнер чата */
        .chat-container {
            background: #1e1e1e;
            width: 100%;
            max-width: 800px;
            flex: 1;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            border: 1px solid #333;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user-message {
            background: #00e676;
            color: #000;
            align-self: flex-end;
            font-weight: 500;
        }
        .ai-message {
            background: #2a2a2a;
            color: #e0e0e0;
            align-self: flex-start;
            border: 1px solid #3d3d3d;
        }
        .system-message {
            background: #332a00;
            color: #ffd700;
            align-self: center;
            font-size: 0.9rem;
            border: 1px solid #665200;
        }

        /* Форма ввода */
        .chat-input-area {
            display: flex;
            padding: 15px;
            background: #181818;
            border-top: 1px solid #333;
            gap: 10px;
        }
        .chat-input-area input[type="text"] {
            flex: 1;
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
        }
        .btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:hover {
            background: #00c853;
        }
        .btn-file {
            background: #333;
            color: #fff;
            border: 1px solid #555;
        }
        .btn-file:hover {
            background: #444;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>LirdiChat <span>AI</span> Online</h1>
    </header>

    <!-- Панель настройки API Ключа -->
    <div class="api-panel">
        <label for="apiKey">Groq API Key:</label>
        <input type="password" id="apiKey" placeholder="Вставьте ваш gsk_... ключ">
        <button class="btn" onclick="saveKey()">Сохранить</button>
    </div>

    <!-- Чат окно -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">Привет! Я LirdiChat AI. Задавай мне любые вопросы, проси написать код или анализируй .JAR файлы прямо в браузере!</div>
        </div>

        <div class="chat-input-area">
            <input type="file" id="fileInput" accept=".jar" onchange="handleFileSelect(event)">
            <button class="btn btn-file" id="fileBtn" onclick="document.getElementById('fileInput').click()">📎 .JAR</button>
            <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
            <button class="btn" onclick="sendMessage()">Отправить</button>
        </div>
    </div>

    <script>
        let selectedJarContent = "";
        let selectedJarName = "";

        // Восстановление ключа из памяти браузера
        window.onload = function() {
            const savedKey = localStorage.getItem("groq_api_key");
            if (savedKey) {
                document.getElementById("apiKey").value = savedKey;
            }
        };

        function saveKey() {
            const key = document.getElementById("apiKey").value.trim();
            localStorage.setItem("groq_api_key", key);
            alert("API-ключ сохранен в памяти браузера!");
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            selectedJarName = file.name;
            document.getElementById("fileBtn").innerText = "✅ " + file.name;

            // Считывание структуры .jar через JS (в формате текста)
            selectedJarContent = `Прикреплен файл: ${file.name} (Размер: ${file.size} байт)\n`;
            
            appendMessage("system", `Файл ${file.name} прикреплен к следующему сообщению.`);
        }

        async function sendMessage() {
            const inputField = document.getElementById("userInput");
            const userText = inputField.value.trim();
            const apiKey = document.getElementById("apiKey").value.trim();

            if (!userText && !selectedJarContent) return;
            if (!apiKey) {
                alert("Пожалуйста, укажите Groq API Key в верхней панели!");
                return;
            }

            let fullPrompt = userText;
            if (selectedJarContent) {
                fullPrompt = `${selectedJarContent}\nВопрос пользователя: ${userText}`;
                selectedJarContent = "";
                selectedJarName = "";
                document.getElementById("fileBtn").innerText = "📎 .JAR";
            }

            appendMessage("user", userText);
            inputField.value = "";

            const loadingMsg = appendMessage("ai", "LirdiChat AI думает...");

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            {
                                role: "system",
                                content: "Тебя зовут LirdiChat AI. Ты умный ассистент, который отлично пишет код, отвечает на любые вопросы и помогает программистам."
                            },
                            {
                                role: "user",
                                content: fullPrompt
                            }
                        ]
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    const aiReply = data.choices[0].message.content;
                    loadingMsg.innerText = aiReply;
                } else {
                    loadingMsg.innerText = "Ошибка API: " + (data.error?.message || response.statusText);
                }
            } catch (error) {
                loadingMsg.innerText = "Ошибка сети/подключения: " + error.message;
            }
        }

        function appendMessage(type, text) {
            const messagesContainer = document.getElementById("chatMessages");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${type}-message`;
            msgDiv.innerText = text;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
